name: Build Rattel APK

# هذا الأمر يجعل الروبوت يعمل تلقائياً عند أي تعديل، ويسمح لك بتشغيله يدوياً
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # تجهيز محرك Gradle السحابي لأننا لا نملك gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      # استخراج ملف الـ APK النهائي لتقوم بتحميله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rattel-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
